name: Self-checks

# The scripts each have a plain-assert self-check next to them, and the README is held to the skill's own
# read-aloud rules. Nothing here calls a model or costs money: the eval suite is run by hand.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest version the README promises; 3.x is whatever is current
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run every self-check
        run: |
          status=0
          for t in skills/tiered-a11y-audit/scripts/test_*.py; do
            echo "::group::$t"
            python "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: README follows its own rules
        run: python skills/tiered-a11y-audit/scripts/lint_report.py README.md
